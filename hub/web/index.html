<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deckpad hub</title>
<style>
  :root {
    --bg: #0f1115; --tile: #1b1f27; --text: #f2f4f8; --muted: #8a93a3;
    --accent: #4f8cff; --gap: 24px; --radius: 20px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eceff4; --tile: #ffffff; --text: #161a22; --muted: #5b6474; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 18px system-ui, sans-serif; overflow: hidden; }
  main { height: 100%; padding: var(--gap); display: grid; gap: var(--gap);
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); align-content: start;
    overflow-y: auto; scrollbar-width: none; }
  main::-webkit-scrollbar { display: none; }
  a.pc { aspect-ratio: 1; background: var(--tile); border-radius: var(--radius);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: inherit; text-decoration: none; padding: 16px; text-align: center; }
  a.pc strong { font-size: 26px; overflow-wrap: anywhere; }
  a.pc span { color: var(--muted); }
  .empty { grid-column: 1 / -1; height: calc(100vh - 2 * var(--gap)); display: flex;
    align-items: center; justify-content: center; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main id="list"></main>
<script>
  // Page provisoire : la liste des PC trouvés. L'appli tablette viendra s'y brancher.
  const fr = navigator.language.startsWith('fr')
  const t = fr
    ? { empty: 'Aucun PC trouvé.\nLance deckpad sur un PC du même réseau.' }
    : { empty: 'No PC found.\nStart deckpad on a PC on the same network.' }
  const list = document.getElementById('list')

  function tile(a) {
    const el = document.createElement('a')
    el.className = 'pc'
    // En attendant le relais par le serveur, on ouvre l'agent directement.
    el.href = a.httpsPort ? `https://${a.ips[0]}:${a.httpsPort}` : `http://${a.ips[0]}:${a.port}`
    const name = document.createElement('strong')
    name.textContent = a.name
    const ip = document.createElement('span')
    ip.textContent = a.ips[0]
    el.append(name, ip)
    return el
  }

  async function refresh() {
    try {
      const agents = await (await fetch('/api/agents')).json()
      if (agents.length === 0) {
        const p = document.createElement('p')
        p.className = 'empty'
        p.innerText = t.empty
        list.replaceChildren(p)
      } else {
        list.replaceChildren(...agents.map(tile))
      }
    } catch {
      // serveur injoignable un instant : on garde l'affichage
    }
  }
  refresh()
  setInterval(() => { if (!document.hidden) refresh() }, 5000)
</script>
</body>
</html>
